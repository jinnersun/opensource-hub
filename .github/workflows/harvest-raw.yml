name: Harvest Raw Data

on:
  schedule:
    - cron: '0 2 * * *'  # 每日凌晨 2:00 UTC
  workflow_dispatch:     # 支持手动触发

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 快速完成，不超过 15 分钟
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
          
      - name: Install dependencies
        run: |
          cd scripts
          npm ci
          
      - name: Run raw data harvester
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd scripts
          # --discover：抓 GitHub Trending
          # --search：GitHub Search API 按 topic 搜索
          npx tsx github-harvester-raw.ts --discover --search --output ../data/harvested-raw.json
          
      - name: Upload harvest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-results
          path: |
            data/harvested-raw.json
            data/harvested-raw-report.json
            data/harvested-raw.sql
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ 数据采集失败',
              body: `数据采集任务失败，请检查日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'data-pipeline']
            })
