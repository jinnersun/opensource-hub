name: Harvest FAQ Issues

on:
  schedule:
    - cron: '0 3 * * *'  # 每日凌晨 3:00 UTC
  workflow_dispatch:     # 支持手动触发

permissions:
  contents: read
  issues: write

jobs:
  harvest-faq-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies + wrangler
        run: |
          cd scripts
          npm ci
          npm install -g wrangler

      - name: Run V3 collect (采集 + 打分)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd scripts
          npx tsx v3/collect.ts --all

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ FAQ Issue 采集失败',
              body: `FAQ Issue 采集任务失败，请检查日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'data-pipeline']
            })
