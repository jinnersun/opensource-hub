name: Harvest FAQ Issues

on:
  schedule:
    - cron: '0 3 * * *'  # 每日凌晨 3:00 UTC
  workflow_dispatch:     # 支持手动触发

jobs:
  harvest-faq-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 全量采集可能需要较长时间
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json
          
      - name: Install dependencies
        run: |
          cd scripts
          npm ci
          
      - name: Run FAQ Issue harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd scripts
          npx tsx faq-harvester.ts --all
          
      - name: Upload harvest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faq-harvest-results
          path: data/faq-harvest-report.json
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ FAQ Issue 采集失败',
              body: `FAQ Issue 采集任务失败，请检查日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'data-pipeline']
            })
