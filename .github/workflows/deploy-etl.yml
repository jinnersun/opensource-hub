name: Deploy ETL Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/etl/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/etl/package-lock.json
          
      - name: Install dependencies
        run: |
          cd workers/etl
          npm ci
          
      - name: Deploy to Cloudflare
        run: |
          cd workers/etl
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
