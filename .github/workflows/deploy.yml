name: Deploy API Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - 'migrations/**'
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API Worker + D1 Migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: D1 Migrate - Schema
        run: npx wrangler d1 execute opensource-hub-db --remote --file ../../migrations/001_initial_schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: D1 Migrate - Seed Data
        run: npx wrangler d1 execute opensource-hub-db --remote --file ../../migrations/002_seed_data.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy API Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
