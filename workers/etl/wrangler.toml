name = "opensource-hub-etl"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "063b426850c4c65d45b0809040ec8a71"

# 定时触发：每 15 分钟运行一次（Paid plan 批量消化期；稳定后可改回 "0 */2 * * *"）
# 单次 invocation 处理 150 项目，15 分钟间隔充分预留 AI 调用耗时与验证窗口
[triggers]
crons = ["*/15 * * * *"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "opensource-hub-db"
database_id = "9989fa14-ca29-46ef-8c9f-9ab55f6b47d7"

# KV 命名空间绑定（用于存储指标）
[[kv_namespaces]]
binding = "KV"
id = "4a1bc5fb651342528766c6f4248d4e69"

# Workers AI 绑定 (用于 embedding 生成)
[ai]
binding = "AI"

# Vectorize 向量搜索索引
[[vectorize]]
binding = "VECTORIZE"
index_name = "opensource-hub-search"

# 环境变量
[vars]
ENVIRONMENT = "production"

# 需要通过 wrangler secret 配置：
#   wrangler secret put OPENAI_API_KEY   # DeepSeek/OpenAI API Key
#   wrangler secret put GITHUB_TOKEN     # GitHub PAT，用于提升限流到 5000/h
#   wrangler secret put ALERT_WEBHOOK_URL # 可选：失败告警 Webhook
